---
# =============================================================================
# BRICK: components/__COMPONENT__ — entry point
# =============================================================================
# Tags: install | config | service  (so callers can run just a slice with --tags)

- name: "__COMPONENT__ | Gather facts"
  ansible.builtin.setup:
  tags: [always]

- name: "__COMPONENT__ | Require a supported EL (RHEL/Rocky/Oracle) 8/9 host"
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - ansible_distribution_major_version in ['8', '9']
    fail_msg: "This brick supports Enterprise Linux 8/9 only."
  tags: [always]

# --- install: repo (default) or local RPMs (air-gapped) --------------------
- name: "__COMPONENT__ | Install (repo)"
  ansible.builtin.yum:
    name: "{{ __COMPONENT___package }}"
    state: present
  register: __COMPONENT___repo_install
  ignore_errors: "{{ __COMPONENT___install_source == 'auto' }}"
  when: __COMPONENT___install_source in ['repo', 'auto']
  tags: [install]

# The RPMs are vendored on the CONTROLLER (resources/__COMPONENT__/rpms). They
# are looked up there, copied to the target, and installed from that copy.
- name: "__COMPONENT__ | Find local RPMs (on the controller)"
  ansible.builtin.find:
    paths: "{{ __COMPONENT___local_rpms_dir }}"
    patterns: "*.rpm"
  delegate_to: localhost
  become: false
  register: __COMPONENT___local_found
  when: >-
    __COMPONENT___install_source == 'local'
    or (__COMPONENT___install_source == 'auto' and __COMPONENT___repo_install is failed)
  tags: [install]

- name: "__COMPONENT__ | Require at least one local RPM"
  ansible.builtin.assert:
    that:
      - __COMPONENT___local_found.files | length > 0
    fail_msg: >-
      __COMPONENT___install_source={{ __COMPONENT___install_source }} needs .rpm files in
      {{ __COMPONENT___local_rpms_dir }} (on the controller), but none were found.
  when: __COMPONENT___local_found is not skipped
  tags: [install]

- name: "__COMPONENT__ | Create the RPM staging dir on the target"
  ansible.builtin.file:
    path: "{{ __COMPONENT___remote_rpms_dir }}"
    state: directory
    mode: "0755"
  when: __COMPONENT___local_found is not skipped
  tags: [install]

- name: "__COMPONENT__ | Copy local RPMs to the target"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ __COMPONENT___remote_rpms_dir }}/"
    mode: "0644"
  loop: "{{ __COMPONENT___local_found.files | default([]) | map(attribute='path') | list }}"
  loop_control:
    label: "{{ item | basename }}"
  when: __COMPONENT___local_found is not skipped
  tags: [install]

- name: "__COMPONENT__ | Install from local RPMs (offline)"
  ansible.builtin.yum:
    name: >-
      {{ __COMPONENT___local_found.files | map(attribute='path') | map('basename')
         | map('regex_replace', '^', __COMPONENT___remote_rpms_dir ~ '/') | list }}
    state: present
    disable_gpg_check: true
  when:
    - __COMPONENT___local_found is not skipped
    - not ansible_check_mode        # the RPMs are not on the target in check mode
  tags: [install]

# --- config ----------------------------------------------------------------
# TODO: template your config files here. Use `| default(...)` for service knobs:
# - name: "__COMPONENT__ | Deploy config"
#   ansible.builtin.template:
#     src: main.conf.j2
#     dest: /etc/__COMPONENT__/main.conf
#   notify: Restart __COMPONENT__
#   tags: [config]
#
# If you copy a big asset the CALLER ships from resources/, check it exists on
# the CONTROLLER first (not the remote):
#   - ansible.builtin.stat: { path: "{{ some_src }}" }
#     delegate_to: localhost
#     become: false

# --- service ---------------------------------------------------------------
- name: "__COMPONENT__ | Enable and start"
  ansible.builtin.service:
    name: "__COMPONENT__"
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [service]
