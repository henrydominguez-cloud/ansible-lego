name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-syntax:
    name: Lint + syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax-check every playbook (prod + dev)
        run: |
          for env in alpha-prod alpha-dev; do
            for pb in playbooks/*.yml; do
              ansible-playbook -i "inventory/$env" "$pb" --syntax-check
            done
          done
