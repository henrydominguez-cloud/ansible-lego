[defaults]
roles_path = ./roles
inventory = ./inventory/alpha-prod
host_key_checking = False
retry_files_enabled = False
# YAML-formatted task results from the built-in default callback (ansible-core
# >= 2.13). Replaces `stdout_callback = yaml`: that plugin lived in
# community.general and was removed in its 12.0.0 release.
callback_result_format = yaml
# ansible-vault: create .vault_pass (see .vault_pass.example) then EITHER
# uncomment the line below OR pass --vault-password-file .vault_pass per run.
# Left commented so runs work before a vault password exists.
# vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
