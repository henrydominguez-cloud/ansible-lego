[defaults]
roles_path = ./roles
inventory = ./inventory/alpha-prod
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
# ansible-vault: create .vault_pass (see .vault_pass.example) then EITHER
# uncomment the line below OR pass --vault-password-file .vault_pass per run.
# Left commented so runs work before a vault password exists.
# vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
