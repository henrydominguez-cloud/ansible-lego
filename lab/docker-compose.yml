# Local test lab: a few systemd-enabled EL hosts you run the roles against.
#   LAB_PLATFORM=linux/arm64  -> native, fast (structural: --check --diff)
#   LAB_PLATFORM=linux/amd64  -> emulated, slow (full install of x86_64 RPMs)
# Managed via the Makefile: `make lab-up`, `make lab-check`, `make lab-run`, `make lab-down`.
#
# systemd in a container needs: privileged + the cgroup fs + tmpfs for /run.
services:
  rocky9a:
    build:
      context: .
      dockerfile: Dockerfile.el
      args: { BASE: "rockylinux/rockylinux:9" }
    image: lab-el9
    platform: ${LAB_PLATFORM:-linux/arm64}
    container_name: rocky9a
    hostname: rocky9a
    privileged: true
    tmpfs: [ /run, /run/lock, /tmp ]
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    stop_signal: SIGRTMIN+3

  rocky9b:
    image: lab-el9            # reuses the EL9 image built by rocky9a
    platform: ${LAB_PLATFORM:-linux/arm64}
    container_name: rocky9b
    hostname: rocky9b
    depends_on: [ rocky9a ]
    privileged: true
    tmpfs: [ /run, /run/lock, /tmp ]
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    stop_signal: SIGRTMIN+3

  rocky8:
    build:
      context: .
      dockerfile: Dockerfile.el
      args: { BASE: "rockylinux/rockylinux:8" }
    image: lab-el8
    platform: ${LAB_PLATFORM:-linux/arm64}
    container_name: rocky8
    hostname: rocky8
    privileged: true
    tmpfs: [ /run, /run/lock, /tmp ]
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    stop_signal: SIGRTMIN+3
