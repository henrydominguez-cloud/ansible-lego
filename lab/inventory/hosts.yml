all:
  # Ansible reaches the containers via `docker exec` (no SSH). Needs the
  # community.docker collection (in requirements.yml).
  vars:
    ansible_connection: community.docker.docker
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3.11
    # Lab only: switch users with `su`, not `sudo`. On an Ubuntu Docker host
    # (e.g. Colima) the host's AppArmor profile for unix_chkpwd also confines
    # that binary inside the containers, so PAM cannot read /etc/shadow (mode
    # 000 on EL) and `sudo` fails its account check. We are already root here,
    # so `su` needs no password. Real inventories keep sudo (ansible.cfg).
    ansible_become_method: su
  children:
    hello:
      hosts:
        rocky9a: {}   # hello-web (nginx)          -> :8080
    notes:
      hosts:
        rocky9b: {}   # notes-api (nginx+postgres) -> :8081
