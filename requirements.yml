---
# Ansible collections this repo relies on. Install with:
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.posix       # selinux/mount/etc. helpers
    version: ">=1.5.0"
  - name: community.general   # general modules
    version: ">=8.0.0"
  - name: community.docker    # docker connection plugin for the local test lab
    version: ">=3.4.0"
